<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>BMdata · Redirection vers le hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redirection automatique vers le hub BMdata.">
  <meta name="robots" content="noindex,follow">
  <!-- Redirection automatique vers le hub -->
  <meta http-equiv="refresh" content="0; url=https://bmdata.fr/hub/">
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#050812;
      color:#e8edf6;
    }
    .card{
      padding:1.8rem 2.2rem;
      border-radius:1.4rem;
      border:1px solid rgba(255,255,255,.12);
      background:radial-gradient(circle at top,#202c5a,#050812 55%);
      max-width:420px;
      text-align:left;
      box-shadow:0 18px 40px rgba(0,0,0,.55);
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      padding:.35rem .9rem;
      border-radius:999px;
      font-size:.8rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#2bd48f;
      border:1px solid rgba(43,212,143,.5);
      background:rgba(43,212,143,.08);
    }
    h1{margin:1rem 0 .5rem;font-size:1.5rem;}
    p{margin:0 0 1rem;font-size:.95rem;opacity:.9;}
    a.btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:.7rem 1.4rem;
      border-radius:999px;
      background:linear-gradient(135deg,#6677ff,#2bd48f);
      color:#050812;
      font-weight:600;
      text-decoration:none;
      font-size:.95rem;
    }
  </style>
</head>
<body>
  <div class="card" aria-live="polite">
    <div class="badge">Hub BMdata</div>
    <h1>Redirection en cours</h1>
    <p>Vous allez être redirigé automatiquement vers le hub de Martial Bodet.</p>
    <a class="btn" href="https://bmdata.fr/hub/">Accéder au hub maintenant</a>
  </div>
</body>
</html>

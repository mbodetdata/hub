<!DOCTYPE html>
<html lang="fr" data-redirect-target="https://bmdata.fr/hub/">
<head>
  <meta charset="utf-8">
  <title>Redirection vers le hub BMdata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url=">
  <script>
    (function () {
      var root = document.documentElement;
      var target = root.getAttribute("data-redirect-target") || "https://bmdata.fr/hub/";
      var metaRefresh = document.querySelector('meta[http-equiv="refresh"]');
      if (metaRefresh) {
        metaRefresh.setAttribute("content", "0; url=" + target);
      }
      function moveAlong() {
        window.location.replace(target);
      }
      if (document.readyState === "complete") {
        moveAlong();
      } else {
        window.addEventListener("DOMContentLoaded", moveAlong);
      }
      var link = document.getElementById("redirect-link");
      if (link) {
        link.href = target;
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 1.5rem;
    }
    a {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Redirection en cours vers le hub BMdata...</h1>
    <p>Vous allez etre automatiquement redirige. Si rien ne se passe, cliquez sur le lien ci-dessous.</p>
    <p><a id="redirect-link" href="https://bmdata.fr/hub/">Acceder au hub BMdata</a></p>
  </main>
</body>
</html>

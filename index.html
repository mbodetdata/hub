---
---
{% assign redirect_target = site.target_url | default: "https://bmdata.fr/hub/" %}
<!DOCTYPE html>
<html lang="fr" data-target-url="{{ redirect_target }}">
<head>
  <meta charset="utf-8">
  <title>BMdata · Redirection vers le hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redirection automatique vers le hub BMdata.">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url=">
  <link rel="preload" href="assets/styles.css" as="style">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .redirect-shell{
      display:flex;
      flex-direction:column;
      gap:clamp(1.4rem,3vw,2.2rem);
    }
    .redirect-card{
      border-radius:clamp(1.2rem,2.6vw,1.8rem);
      padding:clamp(1.8rem,4vw,2.8rem);
      background:color-mix(in oklab, var(--surface-1, #0f1426) 92%, rgba(5,8,18,.85));
      border:1px solid color-mix(in oklab,var(--border, rgba(255,255,255,.18)) 85%, transparent);
      box-shadow:var(--shadow-lg, 0 18px 40px rgba(0,0,0,.45));
      position:relative;
      overflow:hidden;
    }
    .redirect-card__badge{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      padding:.35rem .9rem;
      border-radius:999px;
      font-size:var(--step--1, .92rem);
      letter-spacing:.04em;
      text-transform:uppercase;
      color:color-mix(in oklab,var(--brand-2, #2bd48f) 70%, #fff 30%);
      background:color-mix(in oklab,var(--surface-2, rgba(255,255,255,.06)) 80%, transparent);
      border:1px solid color-mix(in oklab,var(--brand-2, #2bd48f) 35%, transparent);
    }
    .redirect-card h1{
      margin:clamp(1rem,3vw,1.4rem) 0 .6rem;
      font-size:var(--step-3, clamp(2rem, 4vw, 2.8rem));
      line-height:1.2;
    }
    .redirect-card p{ margin:0 0 1rem; color:var(--muted, #a6b1c7); }
    .redirect-card__actions{
      display:flex;
      flex-wrap:wrap;
      gap:.8rem;
      align-items:center;
      margin-top:1rem;
    }
    .redirect-cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:.85rem 1.6rem;
      border-radius:999px;
      background:var(--g-brand, linear-gradient(135deg,#6677ff,#2bd48f));
      color:#050812;
      font-weight:600;
      text-decoration:none;
      box-shadow:var(--shadow-md, 0 12px 26px rgba(0,0,0,.34));
    }
    .redirect-cta:hover,
    .redirect-cta:focus-visible{
      filter:brightness(1.08);
    }
    .redirect-status{ font-size:var(--step-0, 1rem); }
    .redirect-meta{ font-size:var(--step--1, .92rem); color:var(--muted,#a6b1c7); }
    noscript {
      display:block;
      margin:1rem auto;
      max-width:var(--container-tight, 640px);
      padding:1rem 1.4rem;
      border-radius:1rem;
      border:1px solid color-mix(in oklab,var(--border, rgba(255,255,255,.18)) 80%, transparent);
      background:color-mix(in oklab,var(--surface-1, #0f1426) 90%, rgba(0,0,0,.35));
      color:var(--fg,#e8edf6);
    }
  </style>
</head>
<body class="hub-page">
  <div class="hub-page__bg" aria-hidden="true"></div>
  <main class="hub-main">
    <div class="hub-main__inner redirect-shell">
      <section class="hub-card redirect-card" aria-live="polite">
        <span class="redirect-card__badge">Hub BMdata</span>
        <h1>Redirection en cours</h1>
        <p id="redirect-status" class="redirect-status">Initialisation de la redirection...</p>
        <div class="redirect-card__actions">
          <a id="redirect-link" class="redirect-cta" href="{{ redirect_target }}">Accéder au hub</a>
          <span class="redirect-meta">Vous serez automatiquement redirigé dans un instant.</span>
        </div>
      </section>
    </div>
  </main>
  <footer class="hub-footer">
    <p class="hub-footer__text">Une question ? <a href="mailto:hello@bmdata.fr">hello@bmdata.fr</a></p>
  </footer>
  <noscript>
    JavaScript est nécessaire pour la redirection automatique. Vous pouvez <a href="{{ redirect_target }}">accéder directement au hub</a>.
  </noscript>
  <script defer src="assets/script.js"></script>
</body>
</html>

<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/logo_63.webp' | relative_url }}" type="image/webp">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="{{ site.data.hub.profile.photo | relative_url }}" as="image" fetchpriority="high">
  <link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}" as="style">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="hub-page">
  <a class="skip-link" href="#main">Aller au contenu</a>
  <div class="hub-page__bg" aria-hidden="true">
    <div class="hub-bg-orb hub-bg-orb--1" aria-hidden="true"></div>
    <div class="hub-bg-orb hub-bg-orb--2" aria-hidden="true"></div>
    <div class="hub-bg-orb hub-bg-orb--3" aria-hidden="true"></div>
  </div>
  <main id="main" class="hub-main" tabindex="-1">
    <div class="hub-main__inner">
      {{ content }}
    </div>
  </main>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>

<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/logo_63.webp' | relative_url }}" type="image/webp">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:image" content="{{ site.data.hub.profile.og_image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.data.hub.profile.og_image | absolute_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "ProfilePage",
        "@id": "{{ '/' | absolute_url }}#webpage",
        "url": "{{ '/' | absolute_url }}",
        "name": "{{ page.title | default: site.title | escape }}",
        "description": "{{ page.description | default: site.description | escape }}",
        "inLanguage": "fr-FR",
        "dateModified": "{{ site.time | date_to_xmlschema }}",
        "mainEntity": { "@id": "{{ '/' | absolute_url }}#person" }
      },
      {
        "@type": "Person",
        "@id": "{{ '/' | absolute_url }}#person",
        "name": "{{ site.data.hub.profile.title | escape }}",
        "givenName": "{{ site.data.hub.profile.given_name | escape }}",
        "familyName": "{{ site.data.hub.profile.family_name | escape }}",
        "jobTitle": "{{ site.data.hub.profile.job_title | escape }}",
        "description": "{{ site.data.hub.profile.job_description | escape }}",
        "url": "{{ '/' | absolute_url }}",
        "image": {
          "@type": "ImageObject",
          "url": "{{ site.data.hub.profile.photo | absolute_url }}"
        },
        "email": "contact@bmdata.fr",
        "telephone": "+33670210928",
        "worksFor": { "@id": "https://bmdata.fr/#organization" },
        "knowsAbout": ["Data", "Business Intelligence", "Automatisation des processus", "Gouvernance de la donnée", "Migration ETL"],
        "sameAs": [
          "https://www.linkedin.com/in/martial-bodet/",
          "https://bmdata.fr/a-propos/"
        ]
      },
      {
        "@type": ["Organization", "ProfessionalService"],
        "@id": "https://bmdata.fr/#organization",
        "name": "BMData",
        "alternateName": "BM Data",
        "url": "https://bmdata.fr",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ '/assets/img/logo_512.webp' | absolute_url }}"
        },
        "email": "contact@bmdata.fr",
        "telephone": "+33670210928",
        "founder": { "@id": "{{ '/' | absolute_url }}#person" },
        "sameAs": [
          "https://www.linkedin.com/company/bmdata/"
        ]
      }
    ]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="{{ site.data.hub.profile.photo | relative_url }}" as="image" fetchpriority="high">
  <link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}" as="style">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="hub-page">
  <a class="skip-link" href="#main">Aller au contenu</a>
  <div class="hub-page__bg" aria-hidden="true">
    <div class="hub-bg-orb hub-bg-orb--1" aria-hidden="true"></div>
    <div class="hub-bg-orb hub-bg-orb--2" aria-hidden="true"></div>
    <div class="hub-bg-orb hub-bg-orb--3" aria-hidden="true"></div>
  </div>
  <main id="main" class="hub-main" tabindex="-1">
    <div class="hub-main__inner">
      {{ content }}
    </div>
  </main>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

  <!-- Modal prise de rendez-vous -->
  <div id="booking-modal" class="booking-modal" role="dialog" aria-modal="true" aria-label="Prendre rendez-vous" hidden>
    <div class="booking-modal__backdrop"></div>
    <div class="booking-modal__container">
      <div class="booking-modal__handle" aria-hidden="true"></div>
      <header class="booking-modal__header">
        <span class="booking-modal__title">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3" ry="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="15" r="2" fill="currentColor"/></svg>
          Prendre rendez-vous
        </span>
        <button type="button" class="booking-modal__close" aria-label="Fermer">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <div class="booking-modal__iframe-wrap">
        <iframe
          src="https://outlook.office.com/book/meeting@bmdata.fr/?ismsaljsauthenabled"
          title="Prendre rendez-vous — Martial Bodet"
          width="100%" height="100%"
          scrolling="yes"
          loading="lazy">
        </iframe>
      </div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/logo_63.webp' | relative_url }}" type="image/webp">
  <link rel="preload" href="{{ '/assets/styles.min.css' | relative_url }}" as="style">
  <link rel="stylesheet" href="{{ '/assets/styles.min.css' | relative_url }}">
</head>
<body class="hub-page">
  <a class="sr-only" href="#main">Aller au contenu</a>
  <div class="hub-page__bg" aria-hidden="true"></div>
  <main id="main" class="hub-main" tabindex="-1">
    <div class="hub-main__inner">
      {{ content }}
    </div>
  </main>
  <script src="{{ '/assets/script.min.js' | relative_url }}" defer></script>
</body>
</html>
